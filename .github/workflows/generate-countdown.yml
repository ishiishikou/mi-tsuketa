name: Generate countdown voices
on:
  push:
    branches: [feat/playful-countdown-27]
    paths:
      - '.github/workflows/generate-countdown.yml'
      - 'scripts/generate-countdown.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-countdown-voices
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify ffmpeg is available
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Start VOICEVOX CPU engine
        env:
          VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-latest
        run: |
          docker pull "$VOICEVOX_IMAGE"
          docker run --rm -d --name countdown-voicevox -p 127.0.0.1:50021:50021 "$VOICEVOX_IMAGE"
          for i in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:50021/version; then
              exit 0
            fi
            sleep 2
          done
          docker logs countdown-voicevox
          exit 1
      - name: Generate and validate 60 offline MP3s
        env:
          VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-latest
        run: |
          python3 scripts/generate-countdown.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('assets/voices/countdown-manifest.json').read_text())
          assert len(manifest['clips']) == 60
          assert len({c['file'] for c in manifest['clips']}) == 60
          PY
      - name: Commit generated offline assets to feature branch
        run: |
          git add assets/voices/countdown assets/voices/countdown-manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: generate 60 playful countdown voices (#27)"
            git push origin HEAD:refs/heads/feat/playful-countdown-27
          fi
