<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ef" />
  <title>みーつけた - Camera PoC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <p class="eyebrow">みーつけた</p>
      <h1>お顔を映してね</h1>
      <p id="message">「カメラをはじめる」を押すと、お顔を探します。</p>
      <button id="startButton" type="button">カメラをはじめる</button>
      <p class="privacy">カメラ映像は端末内の判定だけに使い、サーバーへ送信しません。</p>
    </section>

    <aside id="cameraBubble" class="camera-bubble" aria-label="フロントカメラ">
      <video id="camera" autoplay playsinline muted></video>
      <div class="face-guide" aria-hidden="true"></div>
      <div id="faceBadge" class="face-badge" data-state="idle">準備前</div>
    </aside>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
