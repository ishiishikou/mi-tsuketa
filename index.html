<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ef" />
  <title>みーつけた</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html[data-night-state="night"] .character { opacity: .58; filter: grayscale(.25); pointer-events: none; }
    html[data-night-state="night"] .character-face { transform: rotate(8deg); }
    html[data-night-state="night"] .sleep-message { display: block; }
    html[data-night-state="night"] #characterMessage { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" id="welcomeCard">
      <p class="eyebrow">みーつけた</p>
      <h1>かくれんぼしよう！</h1>
      <p id="message">「カメラをはじめる」を押して、お顔を映してね。</p>
      <button id="startButton" type="button">カメラをはじめる</button>
      <p class="privacy">カメラ映像は端末内の判定だけに使い、サーバーへ送信しません。</p>
    </section>

    <section id="characterSelect" class="card character-select" aria-labelledby="characterTitle" hidden>
      <p class="eyebrow">みーつけた！</p>
      <h2 id="characterTitle">どの子とかくれんぼする？</h2>
      <p id="characterMessage">いっしょに遊ぶ子をえらんでね。</p>
      <div class="characters" role="list">
        <button class="character" type="button" data-character="rabbit" role="listitem"><span class="character-face" aria-hidden="true">🐰</span><span>うさちゃん</span></button>
        <button class="character" type="button" data-character="bear" role="listitem"><span class="character-face" aria-hidden="true">🐻</span><span>くまちゃん</span></button>
        <button class="character" type="button" data-character="cat" role="listitem"><span class="character-face" aria-hidden="true">🐱</span><span>ねこちゃん</span></button>
      </div>
      <p class="sleep-message" aria-live="polite">暗いから、みんな眠くなっちゃったみたい。</p>
    </section>

    <aside id="cameraBubble" class="camera-bubble" aria-label="フロントカメラ">
      <video id="camera" autoplay playsinline muted></video>
      <div class="face-guide" aria-hidden="true"></div>
      <div id="faceBadge" class="face-badge" data-state="idle">準備前</div>
    </aside>
  </main>

  <script type="module" src="./app.js"></script>
  <script>
    (() => {
      const characterSelect = document.querySelector("#characterSelect");
      const buttons = [...document.querySelectorAll(".character")];
      const sleepMessage = document.querySelector(".sleep-message");
      const isNight = (date = new Date()) => date.getHours() >= 21 || date.getHours() < 6;

      function applyNightRule() {
        const night = isNight();
        document.documentElement.dataset.nightState = night ? "night" : "day";
        if (!characterSelect.hidden && night) {
          buttons.forEach((button) => { button.disabled = true; });
          sleepMessage.textContent = "もう夜だから眠いよ。また明日ね。";
        } else if (!night && document.documentElement.dataset.lightState !== "dark") {
          buttons.forEach((button) => { button.disabled = false; });
          sleepMessage.textContent = "暗いから、みんな眠くなっちゃったみたい。";
        }
      }

      new MutationObserver(applyNightRule).observe(characterSelect, { attributes: true, attributeFilter: ["hidden"] });
      window.addEventListener("light-state-change", applyNightRule);
      document.addEventListener("click", (event) => {
        if (isNight() && event.target.closest(".character")) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      applyNightRule();
      setInterval(applyNightRule, 60_000);
    })();
  </script>
</body>
</html>
